<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduQuest V10.2 - Professional CBT</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0f172a;color:white;text-align:center;padding:12px}
.card{background:#1e293b;max-width:520px;margin:auto;padding:18px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{color:#facc15;margin:5px 0} .sub{color:#94a3b8;font-size:13px}
input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:none;font-size:16px}
input,select{background:#0f172a;color:white;border:1px solid #334155}
button{background:#22c55e;color:white;font-weight:bold;cursor:pointer}
button.blue{background:#3b82f6} button.orange{background:#f97316} button.purple{background:#a855f7} button.red{background:#ef4444}
.qbox{background:#0f172a;padding:14px;border-radius:12px;text-align:left;margin-top:10px}
.opt{background:#1e293b;padding:11px;margin:6px 0;border-radius:10px;cursor:pointer;border:1px solid #334155}
.opt:hover{background:#334155}
#timer{font-size:22px;font-weight:bold;color:#4ade80} #timer.low{color:#ef4444;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.top{display:flex;justify-content:space-between;font-size:14px}
.badge{background:#facc15;color:black;padding:3px 8px;border-radius:20px;font-weight:bold}
table{width:100%;font-size:13px;border-collapse:collapse;margin-top:10px}
td,th{padding:6px;border-bottom:1px solid #334155}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>🎓 EduQuest V10.2</h1>
<div class="sub">Professional CBT • Timer • Sound • Forever Leaderboard<br>By Pius Cyber 🇳🇬</div>

<div id="setup">
<input id="p1" placeholder="Player 1 Name e.g. pius" value="pius">
<input id="p2" placeholder="Player 2 Name e.g. peter" value="peter">
<select id="exam">
<option value="JAMB">🎓 JAMB - UTME (30 mins)</option>
<option value="WAEC">📕 WAEC - SS3 (20 mins)</option>
<option value="NECO">📙 NECO - SS3 (20 mins)</option>
<option value="BECE">📘 BECE / JSS3 (15 mins)</option>
<option value="COMMON">📗 Common Entrance (15 mins)</option>
</select>
<select id="subject"><option value="All">All Subjects</option><option>Maths</option><option>English</option><option>Science</option></select>
<button class="blue" onclick="startGame()">▶ START EXAMINATION</button>
<button class="purple" onclick="showBoard()">🏆 VIEW LEADERBOARD</button>
<div id="board"></div>
</div>

<div id="game" class="hidden">
<div class="top"><span id="turnLabel"></span><span id="timer">30:00</span><span>🪙 <b id="coins">0</b> ❤️ <b id="lives">5</b></span></div>
<div style="margin:8px 0"><span class="badge" id="qCount">Q 1/20</span> <span class="badge" id="examLabel">JAMB</span></div>
<div class="qbox"><div id="qText" style="font-size:18px;font-weight:bold"></div><div id="opts"></div></div>
<button class="orange" onclick="use5050()">🎯 50/50 Lifeline</button>
</div>

<div id="result" class="hidden">
<h2 id="resTitle"></h2>
<p id="resDetail" style="white-space:pre-line;font-size:16px;line-height:1.6"></p>
<button class="blue" onclick="shareResult()">📤 SHARE TO WHATSAPP</button>
<button onclick="location.reload()">🔁 PLAY AGAIN - REMATCH</button>
</div>
</div>

<script>
// ===== QUESTIONS POOL - 30 per exam, game picks 20 no repeat =====
const POOL={
JAMB:[["What is 12 x 8?","86","96","108","98",1],["Capital of Nigeria?","Lagos","Abuja","Kano","Enugu",1],["Synonym of Happy?","Sad","Joyful","Angry","Tired",1],["What is H2O?","Salt","Water","Oxygen","Acid",1],["2+2x3=?","8","10","12","6",0],["Largest planet?","Mars","Jupiter","Venus","Earth",1],["Past tense of go?","Goed","Went","Gone","Going",1],["What is 100/4?","20","25","30","40",1],["Who wrote Romeo & Juliet?","Shakespeare","Achebe","Soyinka","Dickens",0],["Chemical symbol for Gold?","Ag","Au","Gd","Go",1],["What is 15% of 200?","20","25","30","35",2],["Antonym of Hot?","Warm","Cold","Heat","Fire",1],["Nigeria independence year?","1960","1963","1970","1959",0],["What is square root of 144?","12","14","16","11",0],["English: Plural of Child?","Childs","Children","Childes","Childrens",1],["What is 7x7?","47","48","49","50",2],["First President of Nigeria?","Azikiwe","Buhari","Obasanjo","Balewa",0],["What is 3^3?","9","18","27","81",2],["Synonym of Brave?","Fearful","Courageous","Weak","Shy",1],["Capital of Lagos State?","Ikeja","Lekki","Epe","Badagry",0],["What is 50-18?","32","30","34","28",0],["Who is author of Things Fall Apart?","Chinua Achebe","Wole Soyinka","Chimamanda","Ngugi",0],["What is 9x6?","54","56","52","48",0],["Largest ocean?","Atlantic","Pacific","Indian","Arctic",1],["What is 1000/10?","10","100","1000","50",1],["Antonym of Rich?","Poor","Wealthy","Strong","Happy",0],["What is 25+35?","55","60","65","70",1],["What gas do plants absorb?","Oxygen","Carbon Dioxide","Nitrogen","Hydrogen",1],["What is 5! (5 factorial)?","120","100","60","25",0],["Capital of Ghana?","Accra","Kumasi","Lome","Abuja",0]],
WAEC:[["What is 10+15?","20","25","30","35",1],["What is past of eat?","Eated","Ate","Eaten","Eat",1],["What is 5x9?","45","40","50","35",0],["Capital of France?","Paris","London","Rome","Berlin",0],["What is H2SO4?","Sulphuric Acid","Hydrochloric","Nitric","Acetic",0],["What is 100-45?","55","45","65","50",0],["Synonym of Fast?","Slow","Quick","Lazy","Weak",1],["What is 8x8?","64","66","60","68",0],["Who was first man?","Adam","Noah","Moses","Abraham",0],["What is 20% of 100?","10","20","30","40",1],["What is plural of Woman?","Womans","Women","Womanses","Woman",1],["What is 12/3?","3","4","5","6",1],["What is boiling point of water?","90C","100C","110C","80C",1],["Antonym of Up?","Down","High","Top","Above",0],["What is 7+8?","14","15","16","13",1],["Capital of Kenya?","Nairobi","Mombasa","Kampala","Accra",0],["What is 3x4+2?","14","12","10","16",0],["What is photosynthesis?","Plant food making","Animal eating","Water boiling","Rock breaking",0],["What is 9-4?","4","5","6","3",1],["What is square of 9?","81","72","90","99",0],["What is 60/6?","9","10","11","12",1],["Synonym of Big?","Small","Huge","Tiny","Little",1],["What is 15x2?","25","30","35","20",1],["What is capital of Enugu?","Enugu","Onitsha","Owerri","Awka",0],["What is 100+200?","250","300","350","400",1],["What is 2^4?","8","12","16","20",2],["What is opposite of Love?","Like","Hate","Care","Joy",1],["What is 48/8?","5","6","7","8",1],["What is main source of energy?","Moon","Sun","Star","Fire",1],["What is 11x11?","121","111","122","110",0]],
NECO:[["What is 6x6?","36","34","32","38",0],["What is capital of Nigeria?","Abuja","Lagos","Ibadan","Port Harcourt",0],["What is 20+30?","40","50","60","70",1],["Synonym of Good?","Bad","Nice","Wicked","Sad",1],["What is 90/9?","9","10","11","12",1],["What is 3+7?","9","10","11","12",1],["What is chemical for water?","H2O","CO2","O2","NaCl",0],["What is 100/5?","15","20","25","30",1],["What is past of run?","Runned","Ran","Running","Runs",1],["What is 4x7?","26","28","30","24",1],["Capital of Oyo?","Ibadan","Ogbomoso","Oyo","Iseyin",0],["What is 50+50?","90","100","110","120",1],["What is antonym of Day?","Night","Morning","Sun","Light",0],["What is 8+9?","16","17","18","19",1],["What is largest state in Nigeria?","Lagos","Niger","Kano","Borno",1],["What is 2x15?","25","30","35","40",1],["What is 12x2?","22","24","26","28",1],["What is 81/9?","7","8","9","10",2],["What is synonym of Smart?","Dull","Clever","Slow","Weak",1],["What is 5+5+5?","10","15","20","25",1],["What is capital of Ekiti?","Ado-Ekiti","Ikere","Ilawe","Efon",0],["What is 100-99?","0","1","2","3",1],["What is 7x3?","20","21","22","23",1],["What is 60-20?","30","40","50","60",1],["What is 9x9?","81","80","79","82",0],["What is 1+2+3?","5","6","7","8",1],["What is 40/4?","9","10","11","12",1],["What is 6+6+6?","16","17","18","19",2],["What is 10x10?","90","100","110","1000",1],["What is 33+33?","60","66","63","36",1]],
BECE:[["What is 5+5?","9","10","11","12",1],["What is capital of Nigeria?","Abuja","Lagos","Kano","Ibadan",0],["What is 2x3?","5","6","7","8",1],["What is colour of sky?","Blue","Red","Green","Yellow",0],["What is 10-4?","5","6","7","8",1],["What is 4+4?","7","8","9","10",1],["What is 3x3?","6","9","12","8",1],["What is first letter?","A","B","C","D",0],["What is 20/2?","9","10","11","12",1],["What is 7+3?","9","10","11","12",1],["What is 9-3?","5","6","7","8",1],["What is 6x2?","10","12","14","16",1],["What is 15-5?","9","10","11","12",1],["What is 8/2?","3","4","5","6",1],["What is 1+1?","1","2","3","4",1],["What is 5x2?","8","10","12","14",1],["What is 12-2?","9","10","11","12",1],["What is 4x4?","14","15","16","17",2],["What is 30/3?","9","10","11","12",1],["What is 2+2+2?","4","5","6","7",2],["What is 18/3?","5","6","7","8",1],["What is 11+1?","11","12","13","14",1],["What is 9+9?","16","17","18","19",2],["What is 100/10?","9","10","11","12",1],["What is 7x2?","12","14","16","18",1],["What is 3+9?","11","12","13","14",1],["What is 25-5?","19","20","21","22",1],["What is 6+7?","12","13","14","15",1],["What is 4+9?","12","13","14","15",1],["What is 8+8?","14","15","16","17",2]],
COMMON:[["What is 2+2?","3","4","5","6",1],["What is 3+3?","5","6","7","8",1],["What is 5-2?","2","3","4","5",1],["What is 10-5?","4","5","6","7",1],["What is 4x2?","6","8","10","12",1],["What is 2x5?","8","10","12","14",1],["What is 6+4?","9","10","11","12",1],["What is 9-4?","4","5","6","7",1],["What is 3x4?","10","12","14","16",1],["What is 20/2?","9","10","11","12",1],["What is 8+2?","9","10","11","12",1],["What is 7-3?","3","4","5","6",1],["What is 5x3?","13","14","15","16",2],["What is 12/4?","2","3","4","5",1],["What is 1+9?","9","10","11","12",1],["What is 6x3?","16","17","18","19",2],["What is 15-10?","4","5","6","7",1],["What is 7+7?","13","14","15","16",1],["What is 9+1?","9","10","11","12",1],["What is 4+6?","9","10","11","12",1],["What is 8-5?","2","3","4","5",1],["What is 2+8?","9","10","11","12",1],["What is 3+7?","9","10","11","12",1],["What is 5+5?","9","10","11","12",1],["What is 20-10?","9","10","11","12",1],["What is 6+6?","10","11","12","13",2],["What is 9+3?","11","12","13","14",1],["What is 4x3?","10","11","12","13",2],["What is 10+10?","19","20","21","22",1],["What is 30-20?","9","10","11","12",1]]
};
let players=[],current=0,questions=[],qi=0,score=[0,0],correct=[0,0],coins=0,lives=5,timerInt=null,timeLeft=0,exam="",lastResult="";

// ===== SOUND - No file needed, WebAudio =====
function beep(freq,dur,type="sine"){try{let c=new (window.AudioContext||window.webkitAudioContext)();let o=c.createOscillator();let g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=freq;o.type=type;g.gain.value=0.2;o.start();o.stop(c.currentTime+dur);}catch(e){}}
function soundCorrect(){beep(880,0.15);setTimeout(()=>beep(1200,0.2),120)}
function soundWrong(){beep(200,0.3,"sawtooth")}
function soundWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.3),i*180))}
function soundLose(){[400,300,200].forEach((f,i)=>setTimeout(()=>beep(f,0.3,"sawtooth"),i*180))}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){
let p1=document.getElementById("p1").value.trim()||"pius";
let p2=document.getElementById("p2").value.trim()||"peter";
players=[p1,p2]; exam=document.getElementById("exam").value;
let pool=[...POOL[exam]]; shuffle(pool); questions=pool.slice(0,20);
qi=0;score=[0,0];correct=[0,0];coins=0;lives=5;current=0;
let mins={JAMB:30,WAEC:20,NECO:20,BECE:15,COMMON:15}[exam];
timeLeft=mins*60;
document.getElementById("setup").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");
document.getElementById("examLabel").innerText=exam;
startTimer(); showQ();
}
function startTimer(){
clearInterval(timerInt);
timerInt=setInterval(()=>{
timeLeft--; let m=Math.floor(timeLeft/60); let s=timeLeft%60;
let el=document.getElementById("timer"); el.innerText=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
if(timeLeft<=120) el.classList.add("low"); else el.classList.remove("low");
if(timeLeft<=0){clearInterval(timerInt); finishGame(true);}
},1000);
}
function showQ(){
if(qi>=questions.length){finishGame(false);return;}
let q=questions[qi];
document.getElementById("turnLabel").innerText="Turn: "+players[current];
document.getElementById("qCount").innerText="Q "+(qi+1)+"/20 • "+players[current];
document.getElementById("qText").innerText=q[0];
document.getElementById("coins").innerText=coins;
document.getElementById("lives").innerText=lives;
let optsDiv=document.getElementById("opts"); optsDiv.innerHTML="";
let idx=[0,1,2,3]; // keep order simple for V10.2
idx.forEach(i=>{
let d=document.createElement("div"); d.className="opt"; d.innerText=["A. ","B. ","C. ","D. "][i]+q[i+1];
d.onclick=()=>answer(i); optsDiv.appendChild(d);
});
}
function answer(i){
let q=questions[qi];
if(i===q[5]){correct[current]++; score[current]+=20; coins+=10; soundCorrect();}
else{lives--; soundWrong(); if(lives<=0){finishGame(false);return;}}
qi++; current=1-current; showQ();
}
function use5050(){
let opts=document.querySelectorAll(".opt"); let q=questions[qi]; let removed=0;
opts.forEach((el,idx)=>{if(idx!==q[5] && removed<2){el.style.opacity="0.3"; el.onclick=null; removed++;}});
}
function grade(exam,pct){
if(exam==="JAMB"){let s=Math.round(pct*4); return {score:s+"/400",grade:pct>=70?"Excellent - You go pass!":pct>=50?"Good - Keep pushing!":"Try Again - No give up!"};}
if(exam==="WAEC"||exam==="NECO"){return {score:pct+"%",grade:pct>=75?"A1 - Excellent!":pct>=70?"B2 - Very Good!":pct>=60?"C4 - Good!":pct>=50?"D7 - Pass":"F9 - Try Again"};}
return {score:pct+"%",grade:pct>=50?"PASS - You go pass!":"Try Again - No give up!"};
}
function finishGame(timeUp){
clearInterval(timerInt);
let winner = correct[0]>=correct[1]?0:1;
let loser = 1-winner;
let pct = Math.round((correct[winner]/20)*100);
let g = grade(exam,pct);
if(pct>=50) soundWin(); else soundLose();
document.getElementById("game").classList.add("hidden");
let res=document.getElementById("result"); res.classList.remove("hidden");
document.getElementById("resTitle").innerText="🏆 Winner: "+players[winner]+"!";
let txt="EduQuest V10.2 - "+exam+" EXAM RESULT\nWinner: "+players[winner]+"\nScore: "+(score[winner])+" points\nAccuracy: "+pct+"% correct\n"+exam+" Score: "+g.score+"\nGrade: "+g.grade+"\nLoser: "+players[loser]+" - "+Math.round((correct[loser]/20)*100)+"%";
if(timeUp) txt+="\n⏱️ TIME UP! Exam auto-submitted";
document.getElementById("resDetail").innerText=txt;
lastResult=txt+"\nPlay now: https://piuscyber.github.io/EduQuest-Game/";
// ===== FOREVER LEADERBOARD =====
let board=JSON.parse(localStorage.getItem("eduquest_board")||"[]");
board.push({name:players[winner],exam:exam,score:g.score,pct:pct,date:new Date().toLocaleDateString()});
board.sort((a,b)=>b.pct-a.pct); board=board.slice(0,5);
localStorage.setItem("eduquest_board",JSON.stringify(board));
}
function showBoard(){
let board=JSON.parse(localStorage.getItem("eduquest_board")||"[]");
if(!board.length){document.getElementById("board").innerHTML="<p>No wins yet. Play first!</p>";return;}
let h="<table><tr><th>#</th><th>Name</th><th>Exam</th><th>Score</th></tr>";
board.forEach((b,i)=>{h+="<tr><td>"+(i+1)+"</td><td>"+b.name+"</td><td>"+b.exam+"</td><td>"+b.score+" ("+b.pct+"%)</td></tr>";});
document.getElementById("board").innerHTML=h+"</table><p style='font-size:12px'>Saved forever on this phone!</p>";
}
function shareResult(){
let url="https://wa.me/?text="+encodeURIComponent(lastResult);
window.open(url,"_blank");
}
</script>
</body>
</html>
