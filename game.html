<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduQuest V7 - Pius Cyber</title>
<style>
body{font-family:Arial;background:#6a0dad;color:white;text-align:center;padding:15px}
.box{background:white;color:#333;border-radius:15px;padding:15px;max-width:500px;margin:auto}
button{padding:10px 15px;margin:5px;border:none;border-radius:10px;background:#ffcc00;font-weight:bold;cursor:pointer}
button:hover{background:#ffaa00}
.avatar{font-size:35px;padding:10px;border:3px solid #ddd;border-radius:10px;background:white;cursor:pointer}
.avatar.sel{border-color:#6a0dad;background:#ffcc00}
.opt{display:block;width:100%;background:#eee;color:#333;margin:8px 0;text-align:left}
#q{font-size:20px;font-weight:bold}
.coin{background:#ffcc00;color:black;padding:5px 12px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<h1>🎮 EduQuest V7 🔥</h1>
<p>By Pius Cyber | <span class="coin">🪙 <span id="coins">0</span> Coins</span> | 🏆 Daily: <span id="daily">Play Daily = +50 Coins</span></p>

<div class="box" id="setup">
<h3>👤 Choose Your Avatar</h3>
<div>
<button class="avatar" onclick="pickAvatar('🦁',this)">🦁</button>
<button class="avatar" onclick="pickAvatar('🦅',this)">🦅</button>
<button class="avatar" onclick="pickAvatar('🐯',this)">🐯</button>
<button class="avatar" onclick="pickAvatar('🤖',this)">🤖</button>
</div>
<p>Player 1: <span id="av1">🦁</span> <input id="p1" placeholder="Player 1 name" value="Pius"></p>
<p>Player 2: <span id="av2">🤖</span> <input id="p2" placeholder="Player 2 name" value="Paul"></p>

<h3>🎯 Choose Mode</h3>
<button onclick="setMode('normal')">📚 Normal Mode</button>
<button onclick="setMode('jamb')">🎓 JAMB MODE (20 Qs)</button>
<button onclick="setMode('daily')">🔥 DAILY CHALLENGE (+50 Coins)</button>
<p id="modeTxt">Mode: Normal</p>

<h3>📖 Subject</h3>
<button onclick="setSub('Maths')">Maths</button>
<button onclick="setSub('English')">English</button>
<button onclick="setSub('Science')">Science</button>
<button onclick="setSub('Mixed')">Mixed</button>
<p id="subTxt">Subject: Mixed</p>

<button style="background:#00ff88;font-size:18px" onclick="startGame()">▶ START V7 GAME</button>
</div>

<div class="box" id="game" style="display:none">
<p id="topInfo"></p>
<p>⏰ Time: <span id="timer">60</span>s | ❤️ Lives: <span id="lives">3</span> | Score: <span id="score">0</span></p>
<p id="q"></p>
<div id="opts"></div>
<button onclick="buyLife()">🪙 Buy Life - 30 Coins</button>
<button onclick="use5050()">⚡ 50/50 - 10 Coins</button>
</div>

<div class="box" id="over" style="display:none">
<h2 id="overTitle">Game Over!</h2>
<p id="finalScore" style="font-size:22px"></p>
<p id="jambScore"></p>
<button style="background:#25D366;color:white" onclick="shareScore()">📱 Share Score for WhatsApp</button><br>
<button onclick="location.reload()">🔄 Play Again</button>
</div>

<script>
let coins = parseInt(localStorage.getItem('eq_coins')||'0');
let av1='🦁', av2='🤖', mode='normal', subject='Mixed';
let score=0, lives=3, qIndex=0, timeLeft=60, timerInt, currentQ;
document.getElementById('coins').innerText=coins;

let bank=[
{q:"2 + 3 = ?",a:["4","5","6","7"],c:1,sub:"Maths"},
{q:"What is 10 x 5?",a:["40","50","60","15"],c:1,sub:"Maths"},
{q:"Capital of Nigeria?",a:["Lagos","Abuja","Kano","Ibadan"],c:1,sub:"English"},
{q:"Plural of 'child'?",a:["Childs","Children","Childes","Childrens"],c:1,sub:"English"},
{q:"H2O is?",a:["Salt","Water","Oxygen","Fire"],c:1,sub:"Science"},
{q:"Planet we live on?",a:["Mars","Venus","Earth","Jupiter"],c:2,sub:"Science"},
{q:"5 x 5 = ?",a:["20","25","30","15"],c:1,sub:"Maths"},
{q:"Largest ocean?",a:["Atlantic","Indian","Pacific","Arctic"],c:2,sub:"Science"},
{q:"Synonym of 'Happy'?",a:["Sad","Joyful","Angry","Tired"],c:1,sub:"English"},
{q:"What is 100 / 4?",a:["20","25","30","40"],c:1,sub:"Maths"}
];

function sound(type){
  try{
    let ctx=new (window.AudioContext||window.webkitAudioContext)();
    let o=ctx.createOscillator(); o.connect(ctx.destination);
    o.frequency.value = type=='good'?880:200;
    o.type='sine'; o.start(); setTimeout(()=>o.stop(), type=='good'?300:500);
  }catch(e){}
}
function pickAvatar(a,el){
  av1=a; document.getElementById('av1').innerText=a;
  document.querySelectorAll('.avatar').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel'); sound('good');
}
function setMode(m){mode=m; document.getElementById('modeTxt').innerText='Mode: '+m; sound('good');}
function setSub(s){subject=s; document.getElementById('subTxt').innerText='Subject: '+s; sound('good');}
function saveCoins(){localStorage.setItem('eq_coins',coins); document.getElementById('coins').innerText=coins;}

function startGame(){
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='block';
  if(mode=='jamb'){timeLeft=600; document.getElementById('timer').innerText='JAMB 10:00';}
  if(mode=='daily'){document.getElementById('daily').innerText='Daily Active!';}
  nextQ();
  timerInt=setInterval(()=>{
    timeLeft--; 
    if(mode=='jamb'){let m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById('timer').innerText=m+':'+(s<10?'0':'')+s;}
    else document.getElementById('timer').innerText=timeLeft;
    if(timeLeft<=0) endGame();
  },1000);
}
function nextQ(){
  let pool = subject=='Mixed'?bank:bank.filter(x=>x.sub==subject);
  if(pool.length==0) pool=bank;
  currentQ=pool[qIndex % pool.length]; qIndex++;
  let p1=document.getElementById('p1').value||'Pius';
  document.getElementById('topInfo').innerText=av1+' '+p1+' | Mode: '+mode.toUpperCase();
  document.getElementById('q').innerText=currentQ.q;
  document.getElementById('score').innerText=score;
  document.getElementById('lives').innerText=lives;
  let html='';
  currentQ.a.forEach((opt,i)=>{html+=`<button class="opt" onclick="answer(${i},this)">${opt}</button>`});
  document.getElementById('opts').innerHTML=html;
}
function answer(i,btn){
  if(i==currentQ.c){score+=100; coins+=10; saveCoins(); sound('good'); btn.style.background='#00ff88';}
  else{lives--; sound('bad'); btn.style.background='#ff4444'; if(lives<=0){endGame(); return;}}
  setTimeout(nextQ,600);
}
function buyLife(){
  if(coins>=30){coins-=30; lives++; saveCoins(); document.getElementById('lives').innerText=lives; sound('good'); alert('Life bought! ❤️');}
  else alert('You need 30 coins! Answer more questions!');
}
function use5050(){
  if(coins>=10){coins-=10; saveCoins(); let btns=document.querySelectorAll('.opt'); let wrong=[]; btns.forEach((b,idx)=>{if(idx!=currentQ.c) wrong.push(b)}); wrong[0].style.display='none'; wrong[1].style.display='none'; sound('good');}
  else alert('Need 10 coins!');
}
function endGame(){
  clearInterval(timerInt);
  document.getElementById('game').style.display='none';
  document.getElementById('over').style.display='block';
  let bonus = mode=='daily'?50:0; coins+=bonus; saveCoins();
  let p1=document.getElementById('p1').value||'Pius';
  document.getElementById('finalScore').innerText=av1+' '+p1+' scored '+score+' points! 🪙 Coins: '+coins;
  if(mode=='jamb'){
    let jamb = Math.round(score/100*20); // 20 per Q = 400 max
    let msg = jamb>=280?'🔥 You go pass UNILAG!':jamb>=200?'Good! You fit enter Uni!':'Keep practicing, you go pass!';
    document.getElementById('jambScore').innerText='🎓 JAMB SCORE: '+jamb+'/400 - '+msg;
  }
  window._final = score;
}
function shareScore(){
  let p1=document.getElementById('p1').value||'Pius';
  let txt=`🎮 I score ${window._final} for EduQuest V7! ${av1} ${p1} - Beat me if you fit! Play here: https://piuscyber.github.io/EduQuest-Game/`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt));
}
</script>
</body>
</html>
